# Собирает index.json каталога: раз в сутки, по событию от модулей и программы
# (repository_dispatch), вручную и при правке entries/, external.json или схемы.
# Если каталог изменился — коммитит index.json и просит сайт обновиться.
name: build-index

on:
  schedule:
    - cron: '17 3 * * *'           # 06:17 по Москве
  repository_dispatch:
    types: [module-released, library-released, breezecad-released, rebuild]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['entries/**', 'external.json', 'schema/**', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Build index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_index.py
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name  "breezecad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "index: обновлён каталог"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Ask the site to update
        if: steps.commit.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.BZ_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::Нет секрета BZ_DISPATCH_TOKEN — сайт подхватит каталог в своё ежесуточное обновление."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/BreezeCAD/breezecad-site/dispatches \
            -d '{"event_type":"registry-updated"}'
